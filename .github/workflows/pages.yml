name: Pages

# Publishes the standalone static edition in `static-site/` to GitHub Pages.
#
# Why an Action rather than Settings → Pages → "deploy from a branch": that menu only offers
# the repository root or `/docs`, and `docs/` here holds 251 MB of source PDFs that have no
# business being published. An artifact upload can point at any directory.
#
# Nothing is built here. `static-site/` is committed ready to serve, because the inputs it is
# built from (`data/*.jsonl`) are NOT in git — so a build step on a runner would have nothing
# to read. Regenerate locally with `node tools/build-static-site.mjs` and commit the result.

on:
  push:
    branches: [main]
    paths:
      - 'static-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a half-published site is worse
# than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site must not depend on where it is served from: every path in it is relative and
      # routing happens in the fragment, so it works at a domain root and under /<repo>/ alike.
      - name: Refuse root-absolute paths
        run: |
          hits=$(grep -rn 'href="/\|src="/\|url("/' static-site --include='*.html' --include='*.css' --include='*.js' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A root-absolute path breaks the site when served under /<repo>/."
            exit 1
          fi

      # `app.js` builds its HTML by hand, so the failures it can produce are the ones a type
      # system would have caught: an `undefined` in a sentence, an `[object Object]`, a route
      # that throws. Render every route here and a reader never meets one. This needs nothing
      # but the committed `static-site/` — the pipeline inputs are not in git and not wanted.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Render every route outside a browser
        run: node tools/check-static-site.mjs

      # `ci.yml` skips a push confined to `static-site/`, so the comment rule is re-checked
      # here over what this workflow publishes. `tinh/main.css` is built by concatenating
      # `frontend/styles/main.css`, and a Vietnamese comment rides along with it.
      - name: Comments must be English
        run: node tools/check-comment-language.mjs $(git ls-files static-site)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deployment
        uses: actions/deploy-pages@v4
