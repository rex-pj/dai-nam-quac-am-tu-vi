name: CI

# This job builds and tests the Rust workspace, so it should wake only for things that can
# break one. The static edition is a separate program: `static-site/` is its output, `tools/`
# is the plain-Node code that writes and checks it, and `pages.yml` deploys it — none of it is
# read by cargo, and it carries its own workflow and its own render check. A push confined to
# those skips this job entirely.
#
# `ci.yml` itself is deliberately NOT ignored: a change to this file must prove itself here.
# Pull requests stay unfiltered too — a required check that never reports is worse than a slow
# one, and they are what exercises `tools/check-comment-language.mjs` when the change is to
# the checker rather than to the comments it reads.
on:
  push:
    paths-ignore:
      - "static-site/**"
      - "tools/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # ── The plan's constraints, turned into machine-checkable gates ──
      # The gates below strip comment lines: the very comments explaining a rule contain the
      # forbidden keyword, and that produced a false alarm once.

      - name: No magic strings in the query builder
        run: |
          hits=$(grep -rn 'Expr::cust\|execute_unprepared' crates/ --include='*.rs' \
                 | grep -v 'migration/src/pg_ddl.rs' \
                 | grep -v '^[^:]*:[0-9]*: *//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Raw SQL outside pg_ddl.rs. Use the typed builder."
            exit 1
          fi

      - name: Table and column names must be Iden, not strings
        run: |
          hits=$(grep -rn 'Alias::new' crates/ --include='*.rs' \
                 | grep -v '^[^:]*:[0-9]*: *//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Alias::new used. Use #[derive(DeriveIden)]."
            exit 1
          fi

      - name: The pipeline must have no silent fallback
        run: |
          hits=$(grep -rn 'unwrap_or_default\|unwrap_or(' pipeline/ --include='*.rs' \
                 | grep -v '^[^:]*:[0-9]*: *//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A fallback value in the pipeline fabricates data. Fail explicitly."
            exit 1
          fi

      # A comment is one programmer talking to the next, so it is English — see CLAUDE.md.
      # The book itself stays Vietnamese, quoted freely inside those English comments, so
      # this cannot be a grep for diacritics; the checker looks for Vietnamese grammar.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Comments must be English
        run: node tools/check-comment-language.mjs

      # The scan reader is hand-written, so it carries its own checks: a G4 round trip
      # that needs no PDF, and an ink-coverage check that runs when docs/ is present.
      - name: The scan reader
        run: node tools/check-scan-page.mjs
