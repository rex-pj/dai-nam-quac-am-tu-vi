[workspace]
resolver = "3"
members = ["crates/*", "pipeline/*", "tests/testkit"]
default-members = [
  "crates/core",
  "crates/config",
  "crates/entity",
  "crates/migration",
  "crates/adapter-db",
  "crates/app",
  "crates/adapter-web",
  "crates/server",
  "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
sea-orm = { version = "2.0.2", default-features = false, features = [
  "macros",
  "postgres-array",
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Dependencies are optimised once and cached; our own code still builds fast.
[profile.dev.package."*"]
opt-level = 3
