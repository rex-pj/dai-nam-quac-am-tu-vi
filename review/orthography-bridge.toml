# Cầu nối chính tả 1895 ↔ nay.
#
# ĐỌC KỸ TRƯỚC KHI THÊM DÒNG. Bảng này **chỉ sinh gợi ý**; nó không bao giờ được dùng để viết
# lại truy vấn của người dùng, và không bao giờ được dùng để gộp hai mục từ.
#
# Lý do là một phép đo, không phải một ý kiến: trong chính cuốn sách này, phần lớn các cặp
# "chính tả cũ / chính tả nay" là HAI MỤC TỪ RIÊNG BIỆT, mỗi mục có định nghĩa riêng.
#
#   quấc ✓ và quốc ✓ · sanh ✓ và sinh ✓ · chánh ✓ và chính ✓ · nhựt ✓ và nhật ✓ · bịnh ✓ và bệnh ✓
#
# Chuẩn hoá tự động sẽ trộn nghĩa của hai mục từ khác nhau — đúng kiểu đoán mà cả dự án này
# được dựng lên để chống. Vì vậy mỗi dòng ở đây chỉ nói: "nếu người tra gõ A, có thể họ cũng
# muốn xem B", và giao diện hiện nó thành một liên kết để họ tự bấm.
#
# Hai lớp KHÁC NHAU, đừng lẫn:
#   - Đặt dấu (`tòa`/`toà`) là phép biến đổi cơ học, không đổi nghĩa → xử lý ở `text::fold`,
#     KHÔNG cần bảng này.
#   - Biến thể chính tả (dưới đây) có thể là hai mục từ → chỉ gợi ý.
#
# `verified_by` để trống nghĩa là chưa có người đối chiếu bản in.

