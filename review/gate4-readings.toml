# Chốt ④ — tự dạng mà TẬP ÂM ĐỌC của parser khác bảng Mục Từ.
#
# 4.673 tự dạng đối chứng được; 4.659 khớp nguyên văn; 14 tự dạng dưới đây khác.
# Không dùng ngưỡng phần trăm: mỗi tự dạng ở đây phải có lý do do người viết, và chốt ④ chỉ
# xanh khi MỌI điểm lệch đều có mặt trong hồ sơ này. Một tự dạng lệch mới xuất hiện mà chưa
# ai ghi vào đây sẽ làm chốt đỏ và chặn `import`.
#
# Bốn nhóm nguyên nhân, và chúng khác nhau về bản chất:
#
#   am_kep_ngan_bang_dau_phay
#       Bản in ghi hai âm trên cùng dòng mục từ, ngăn bằng dấu phẩy (`Tảo, Táo`). Bảng Mục Từ
#       tách thành hai; parser GIỮ NGUYÊN VĂN. Tách là một phép đoán về ý định bản in, và
#       chính phép đoán ấy từng tạo ra bốn ca "lệch" giả khi đối chứng lần đầu.
#
#   nhan_dung_dau_phay
#       Bản in ghi `c,` thay `c.` (4 dòng, tr.976–978). Parser cố ý không nhận dấu phẩy làm
#       nhãn, nên phần `c,` còn lẫn trong âm đọc. Xem thêm review/gate4-index.toml.
#
#   am_trong_ngoac_tach_rieng
#       Bản in ghi `Đàu (đào)`. Parser lưu `Đàu` vào `reading` và `đào` vào `alternate` —
#       hai trường khác nhau; bảng Mục Từ gộp cả cụm thành một chuỗi. Đây là khác biệt về
#       MÔ HÌNH, không phải về dữ liệu: không có chữ nào mất đi.
#
#   bang_gan_tu_dang_cho_muc_dung_anh
#       Bảng gán một tự dạng cho mục từ mà bản in dùng ẢNH. Lớp text của PDF đánh dấu chỗ đó
#       là `.notdef`, nên parser không thể biết. Đây là dấu vết của nguồn thứ hai mà người
#       lập bảng có — cùng hiện tượng với nhóm `missing_glyph` ở gate4-index.toml.
#
# LỊCH SỬ: hồ sơ này từng có 17 mục. Ba mục (辰 Thìn, 對 Tụi, 焠 Tui) hoá ra là BUG THẬT —
# bản in ghi nhãn dính `c.n.` không khoảng trắng ở 4 dòng, và parser đánh rơi trọn cả bốn mục
# từ. Chính chốt ④ bắt được. Đã sửa; mục từ 7.683 → 7.687.

