# ── Nhóm 3: khác biệt do MÔ HÌNH, không phải lỗi ──────────────────────────────
# a) Bang tach dau phay, parser giu nguyen van:
#      㩒  parser "Cắm, cặm"        bang "Cắm" + "cặm"
#      掃  parser "Tảo, Táo"        bang "Táo" + "Tảo"
#      乏  parser "Mặp, Mắp"        bang "Mắp" + "Mặp"
#    Tach dau phay la mot phep doan — ban in viet lien mot muc hai am.
# b) Bang gop am trong ngoac vao am doc, parser tach thanh truong `alternate`:
#      佻  parser "Đàu" + alternate "(đào)"   bang "Đàu (đào)"
#      杜  parser "Đậu" + alternate "(đỗ)"    bang "Đậu (đỗ)"
#      標  parser "Biêu," + alternate "(tiêu)" bang "Biêu" + "(tiêu)"
#    Ca hai deu dung; chi khac cach mo hinh hoa.
