# Chốt ④ — các điểm lệch giữa dữ liệu parse và bảng Mục Từ.
#
# Nguyen tac: KHONG dung nguong phan tram. Moi diem lech phai duoc sua hoac co ly do
# do nguoi viet o day. "99% khop" khong noi gi ve 1% kia.
#
# Ket qua hien tai: 0 tu dang BIA (quan trong nhat), 5 tu dang bo sot, 14 tap am doc khac.
# Cac tap am doc khac nam o ho so rieng: review/gate4-readings.toml

# ── Nhóm 1: tự dạng bảng Mục Từ có mà lớp text của PDF KHÔNG hề chứa ───────────
# Đã kiểm: cả 5 chữ này không xuất hiện một lần nào trong toàn bộ lớp text.
# Đây là bằng chứng bảng Mục Từ KHÔNG suy ra được hoàn toàn từ lớp text — người lập bảng
# hẳn có thêm nguồn khác (bản dựng trang, hoặc nhận dạng thủ công).
# Kế toán khớp: 4.673 (parser) + 5 (nhóm này) = 4.678 (bảng).

