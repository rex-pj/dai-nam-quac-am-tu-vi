#
# Đây là nhân chứng có thẩm quyền cao nhứt trong cả kho nầy, mà cũng là nhân chứng duy nhứt
# do chính tác giả viết ra. Bản in tự chỉ chỗ sai của mình, ở hai nơi:
#
#   SAI SÓT            cuốn 1, ảnh 14   — sửa cho cuốn 1
#   ĐÍNH NGOA 訂 訛    cuốn 2, ảnh 2-3  — sửa cho cả cuốn 1 lẫn cuốn 2
#
# Chép tay từ ảnh trang in, KHÔNG lấy của Wikisource: bản chép ấy mang giấy phép CC BY-SA,
# vả lại chỗ nào cũng phải ngó tận mực mới chắc. (Chỗ nào bản chép ấy đọc khác thì có ghi ở
# `note`.) Mở ảnh ra coi lại:
#
#   node tools/scan-page.mjs 1 15 saisot.png
#   node tools/scan-page.mjs 2 3  dinhngoa.png
#   node tools/scan-page.mjs 2 4  dinhngoa2.png
#
# Số trang trong `printed_page_1895` là số trang CỦA BẢN IN 1895, không phải số trang bản
# 2026 nằm ở `printed_page` của dữ liệu. Hai bản dàn trang khác nhau, bản 1895 hai cuốn
# 1204 trang, bản 2026 một cuốn 1037 trang. Vì vậy chốt ⑦ không dò theo số trang: chữ thì dò
# theo `reading` cộng `anchor` (một mẩu lời chú giải của chính mình), lời thì dò xem câu cũ
# còn nằm trong dữ liệu hay không.
#
# `kind`:
#   glyph  — sửa hẳn một chữ Hán-Nôm của chữ đầu. Dò được, và chốt ⑦ đếm.
#   text   — sửa lời. Chốt ⑦ chỉ bắt khi câu CŨ hãy còn trong dữ liệu; không thấy thì thôi,
#            chớ không dám nói là đã sửa.
#   note   — lời dặn (dời mục, thêm dấu ngăn, coi chữ khác). Máy không dò được.
#
# `reason` là chỗ người viết: vì sao dữ liệu mình chưa theo lời sửa nầy mà vẫn chấp nhận
# được. Chốt ⑦ bắt hai đằng: dòng nào dữ liệu KHÔNG theo mà không có `reason` thì đỏ, mà
# dòng nào dữ liệu ĐÃ theo rồi lại còn `reason` thì cũng đỏ — hồ sơ cũ không còn làm chứng
# cho điều gì nữa. Sửa dữ liệu xong thì phải xóa cái `reason` đi.
#
# `verified_by` là chữ ký: đã mở ảnh trang in ra coi, và nhận trách nhiệm về dòng nầy.

