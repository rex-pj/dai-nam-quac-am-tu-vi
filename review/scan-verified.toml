pdf_page = 861
was = "thế giới"
now = "thế giái"
volume = 2
scan_page = 400
crop = "0.54 0.195 0.99 0.235"
note = """
Bản in (cuốn 2, trương 394, cột phải) đặt: `Tam ― thế giái. Ba ngàn thế giái, (nói theo \
đạo Phật).` Hai chỗ đều `giái`. Lớp chữ bản 2026 ghi `thế giới` cả hai, bản chép Wikisource \
(ảnh 2.pdf/399, chưa hiệu đính) cũng vậy. Sách còn 13 chỗ khác viết `thế giái`, và chữ đầu \
界 trong sách đọc là `Giái` chớ không phải `Giới` — mục 界 Giái trang 315, \"Cõi, bờ cõi\"; \
không có mục 界 Giới nào.\
"""
